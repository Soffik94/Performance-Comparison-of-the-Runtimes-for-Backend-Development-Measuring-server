global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'app-server-node-exporter'
    static_configs:
      - targets: ['app-server:9100']

  - job_name: 'measurement-server-node-exporter'
    static_configs:
      - targets: ['measurement-server:9100']

  - job_name: 'db-server-node-exporter'
    static_configs:
      - targets: ['database-server:9100']

  - job_name: 'postgres'
    static_configs:
      - targets: ['database-server:9187']
